services:
  gateway:
    image: gateway
    build:
      context: ./gateway
      dockerfile: dockerfile
    volumes:
      - ./gateway:/gateway
      - /gateway/node_modules
    ports:
      - "3000:3000"
    command: npm run dev

  ms-python:
    image: ms-python
    build:
      context: ./ms-python
      dockerfile: dockerfile
    volumes:
      - ./ms-python:/ms-python
    ports:
      - "5000:5000"
    environment:
      - PYTHONUNBUFFERED=1