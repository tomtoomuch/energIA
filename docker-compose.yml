services:
  gateway:
    build: ./gateway
    ports:
      - "${GATEWAY_PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      - ms-python
    restart: unless-stopped

  ms-python:
    build: ./ms-python
    ports:
      - "${PYTHON_PORT:-8000}:8000"
    env_file:
      - .env
    restart: unless-stopped
